[project]
name = "syllabot-api"
version = "0.0.0"
description = "Syllabot Platform API"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "fastapi==0.146.0",
    "google-genai==2.31.0",
    "ollama==0.6.3",
    "pgvector==0.5.1",
    "pydantic-settings==2.16.0",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.5",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.14.0",  # Starlette's TestClient; plain httpx is deprecated there (PLAN.md A7)
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "testcontainers[postgres]==4.15.0",
]

[tool.uv]
package = false
# Supply-chain cool-off (PLAN.md §3.2): never resolve a release younger than 14 days.
exclude-newer = "14 days"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake credentials
"app/db/migrations/versions/**" = ["E501"]  # autogenerated SQL strings

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not live and not eval"]
markers = [
    "unit: fast, no I/O",
    "integration: needs Postgres/Redis",
    "live: calls real LLM/embedding providers (opt-in)",
    "eval: RAG evaluation set (reports, never gates CI)",
]
